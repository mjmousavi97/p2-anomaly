name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CPU-only torch, same version as Colab
        run: pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner resources
        run: |
          nproc
          free -h
          df -h /

      - name: Docker works
        run: docker run --rm hello-world
