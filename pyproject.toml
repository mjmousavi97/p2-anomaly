[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-anomaly"
version = "0.1.0"
description = "PaDiM industrial visual anomaly detection project"
requires-python = ">=3.10"

# Libraries required to run the project
dependencies = ["numpy", "torch", "torchvision"]

# Libraries required only for development and testing
[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
